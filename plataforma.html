<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plataforma IBCS</title><style>:root{font-family:Arial,sans-serif;color:#102a43;background:#eef3f8}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:15px 5%;background:#082b47;color:#fff}header button,.btn{border:0;border-radius:7px;background:#1595d3;color:#fff;padding:9px 13px;font-weight:700;cursor:pointer}main{max-width:1180px;margin:22px auto;padding:0 16px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.card{background:#fff;border:1px solid #bdc8d2;border-radius:14px;padding:17px;box-shadow:0 8px 24px #1232}label{display:block;margin:9px 0;color:#526b7d}input,select,textarea{width:100%;padding:10px;border:1px solid #aebbc6;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #d5dde4;text-align:left}th{background:#e7edf2}.actions{display:flex;gap:5px}.danger{background:#bb3f3f}.muted{color:#657d8d}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.sync{font-size:12px;color:#567}@media(max-width:800px){.grid{grid-template-columns:1fr}.card{overflow:auto}}</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script></head><body><header><strong>IBCS | Dados Compartilhados</strong><div><span id="userEmail"></span> <button onclick="ibcsSignOut()">Sair</button></div></header><main><div class="top"><h1>Clientes</h1><span id="sync" class="sync">Conectando...</span></div><div class="grid"><section class="card"><h2>Novo cliente</h2><form id="clientForm"><label>Empresa<input id="clientName" required></label><label>Setor<select id="sector"><option>Leite</option><option>Mel</option><option>Carne</option><option>Ovos</option><option>Queijo</option><option>Outro</option></select></label><label>Cidade<input id="city"></label><label>Contato<input id="contact"></label><label>Telefone<input id="phone"></label><label>E-mail<input id="clientEmail" type="email"></label><label>Etapa<select id="stage"><option>Prospecção</option><option>Contato</option><option>Proposta</option><option>Negociação</option><option>Fechado</option></select></label><label>Potencial<input id="potential" type="number" step="0.01" value="0"></label><button class="btn">Salvar cliente</button></form><div id="msg"></div></section><section class="card"><h2>Empresas cadastradas</h2><table><thead><tr><th>Empresa</th><th>Setor</th><th>Cidade</th><th>Etapa</th><th>Ações</th></tr></thead><tbody id="clientRows"></tbody></table></section></div></main><script>let session,channel;const byId=id=>document.getElementById(id);async function load(){session=await ibcsSessionRequired();if(!session)return;userEmail.textContent=session.user.email;await loadClients();channel=ibcsSupabase.channel('clientes-compartilhados').on('postgres_changes',{event:'*',schema:'public',table:'clients'},()=>loadClients()).subscribe();sync.textContent='Sincronização ativa'}async function loadClients(){const {data,error}=await ibcsSupabase.from('clients').select('*').order('name');if(error){sync.textContent=error.message;return}clientRows.innerHTML=(data||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.sector)}</td><td>${esc(c.city||'')}</td><td>${esc(c.stage)}</td><td><div class="actions"><button class="btn danger" onclick="removeClient('${c.id}')">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhum cliente cadastrado.</td></tr>'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}clientForm.onsubmit=async e=>{e.preventDefault();msg.textContent='Salvando...';const {error}=await ibcsSupabase.from('clients').insert({name:clientName.value,sector:sector.value,city:city.value,contact_name:contact.value,phone:phone.value,email:clientEmail.value||null,stage:stage.value,potential:Number(potential.value||0)});msg.textContent=error?error.message:'Cliente salvo.';if(!error){clientForm.reset();potential.value=0;loadClients()}};async function removeClient(id){if(!confirm('Excluir cliente?'))return;const {error}=await ibcsSupabase.from('clients').delete().eq('id',id);if(error)alert(error.message);else loadClients()}load();</script></body></html>
