<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Plataforma IBCS</title><style>:root{font-family:Arial,sans-serif;color:#102a43;background:#edf3f8}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:linear-gradient(135deg,#061827,#0b65a5 55%,#d9e0e7)}main{width:min(470px,94vw);background:#fff;border:2px solid #bdc8d2;border-radius:20px;padding:28px;box-shadow:0 28px 80px #0006}h1{color:#0b65a5}label{display:block;margin:12px 0;color:#4f6678}input{width:100%;padding:12px;border:1px solid #aebbc6;border-radius:8px;font-size:16px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#0b65a5;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.secondary{background:#e5ebf0;color:#102a43;margin-top:8px}#msg{min-height:24px;margin-top:10px;color:#b02d2d}.tabs{display:flex;gap:7px}.tabs button{background:#dfe7ee;color:#102a43}.tabs button.active{background:#0b65a5;color:#fff}.hidden{display:none}</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script></head><body><main><h1>Plataforma IBCS</h1><p>Acesso seguro para dados compartilhados de usuários e clientes.</p><div class="tabs"><button id="tabLogin" class="active" type="button">Entrar</button><button id="tabSignup" type="button">Primeiro acesso</button></div><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><form id="signupForm" class="hidden"><label>Nome completo<input id="fullName" required></label><label>E-mail<input id="signupEmail" type="email" required></label><label>Senha<input id="signupPassword" type="password" minlength="8" required></label><label>Código de convite<input id="inviteToken" required></label><button>Criar acesso</button></form><div id="msg"></div><a href="index.html">Voltar ao site</a></main><script>const msg=document.getElementById('msg'),lf=document.getElementById('loginForm'),sf=document.getElementById('signupForm');function tab(signup){lf.classList.toggle('hidden',signup);sf.classList.toggle('hidden',!signup);tabLogin.classList.toggle('active',!signup);tabSignup.classList.toggle('active',signup);msg.textContent=''}tabLogin.onclick=()=>tab(false);tabSignup.onclick=()=>tab(true);lf.onsubmit=async e=>{e.preventDefault();msg.textContent='Verificando...';try{await ibcsSignIn(email.value,password.value);location.href='plataforma.html'}catch(x){msg.textContent=x.message}};sf.onsubmit=async e=>{e.preventDefault();msg.textContent='Criando acesso...';try{const r=await ibcsSignUp(signupEmail.value,signupPassword.value,fullName.value,inviteToken.value.trim());msg.textContent=r.session?'Acesso criado. Redirecionando...':'Confira seu e-mail para confirmar o cadastro.';if(r.session)setTimeout(()=>location.href='plataforma.html',800)}catch(x){msg.textContent=x.message}};</script></body></html>
